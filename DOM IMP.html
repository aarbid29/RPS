<!DOCTYPE html>
<html>
    <head><title> DOM Exercises</title> 
        <style> 
        .col{
            background-color: green;
            border-width: 0px;
            color: azure;
            


        }
        .hello{
            font-size: 15px;
            background-color: black;
            color: white;
            padding: 7px 16px;
            border: none;
            font-weight: bold;
            border-radius: 50px;
            transition: box-shadow 0.15s;
            cursor: pointer;
                        

        }
        .clicked{
            font-size: 15px;
            background-color: rgb(240, 240, 240);
            color: black;
            padding: 7px 16px;
            border: none;
            font-weight: bold;
            border-radius: 50px;
            transition: box-shadow 0.15s;
            cursor: pointer;}
         
           




        
        </style>
     </head>


    <body>
        <p>YouTube Subscribe Button</p>

        <button class="first hello" 
        onclick=" f1(); ">Subscribe</button><br><br><br>

        <p>Rock Paper Scissors</p>
        <a href="RPS Final.html" >Click here</a><br><br><br>


        <p> Amazon Shipping Calculator</p>
        <p>
            Orders under $40 = +$10 shipping.<br>
          </p>
          <p>
            Orders over $40 = FREE shipping.
          </p>
          <input type="search" placeholder="Cost of order" class='in'>
          
          <button onclick=" check() 
    
          "
          class="col">Calculate</button>

          <p class="amt"> </p>
        

        

        
    <script> 
    function f1(){

        const firstt= document.querySelector('.first');
        console.log(firstt.innerHTML);
        if (firstt.innerHTML === 'Subscribe'){
            firstt.innerHTML='Subscribed';
            firstt.classList.add('clicked'); 

        }else{firstt.innerHTML ='Subscribe'; 
        firstt.classList.remove('clicked');}
    }



    function check(){
        const input  = document.querySelector('.in');
        const valueee= input.value;
        let valuee = parseInt(valueee);
    
        if (valuee<=40){
            return     document.querySelector('.amt').innerHTML= valuee+10;

        }
        else if(valuee===null){
            return     document.querySelector('.amt').innerHTML= '10';

        }
        else{return     document.querySelector('.amt').innerHTML= valuee;


        }


    }
    





    



    
    </script>
    
    
 


        

       



        
        
        
        
        
        
        
        
        
        

        


      




    </body>







</html>
